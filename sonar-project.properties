# SonarCloud Configuration for AI Research Agent
sonar.projectKey=ai-research-agent
sonar.organization=ai-research-org
sonar.projectName=AI Research Agent
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/__tests__,frontend/src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/*.d.ts

# Language settings
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.file.suffixes=.js,.jsx

# Coverage settings
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Code quality gates
sonar.qualitygate.wait=true

# Duplication settings
sonar.cpd.exclusions=**/*.d.ts,**/generated/**

# Security hotspot detection
sonar.security.hotspots.inheritance.enabled=true

# Analysis settings
sonar.analysis.mode=publish
sonar.buildString=GitHub Actions Build