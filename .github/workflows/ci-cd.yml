# CI that runs what actually exists in this repository: lint, typecheck, and
# unit tests for the backend; lint and a production build for the frontend.
#
# The previous 795-line pipeline referenced npm scripts (test:unit,
# migrate:test, seed:test), a Postgres service, Docker registries, and
# staging/production deploy targets that this project does not have — so it
# had never passed. If real deployment infrastructure arrives, grow this file
# alongside it rather than ahead of it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.check.json --noEmit

      - name: Unit tests
        run: npm test -- --ci

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
