# Prometheus configuration for AI Research Agent monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rule files
rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # AI Research Agent API
  - job_name: 'ai-research-agent'
    static_configs:
      - targets: ['localhost:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: false
    params:
      format: ['prometheus']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s

  # PostgreSQL Exporter (if using PostgreSQL)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 30s

  # Redis Exporter (if using Redis)
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 30s

  # Nginx/Load Balancer metrics
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['localhost:9113']
    scrape_interval: 30s

  # Blackbox exporter for external dependency monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://api.openai.com/v1/chat/completions
        - https://api.tavily.com/search
        - https://api.pinecone.io/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Recording rules for aggregated metrics
recording_rules:
  - name: ai_research_agent_aggregations
    interval: 30s
    rules:
      # Success rate calculation
      - record: ai_research_agent:success_rate_5m
        expr: |
          rate(ai_research_agent_queries_successful_total[5m]) / 
          rate(ai_research_agent_queries_total[5m]) * 100

      # Average response time
      - record: ai_research_agent:avg_response_time_5m
        expr: |
          histogram_quantile(0.50, 
            rate(ai_research_agent_research_duration_bucket[5m])
          )

      # Error rate by type
      - record: ai_research_agent:error_rate_by_type_5m
        expr: |
          rate(ai_research_agent_errors_total[5m]) by (error_type)

      # User engagement metrics
      - record: ai_research_agent:active_users_5m
        expr: |
          increase(ai_research_agent_unique_users_total[5m])

      # Cost efficiency
      - record: ai_research_agent:cost_per_query_5m
        expr: |
          rate(ai_research_agent_cost_total[5m]) / 
          rate(ai_research_agent_queries_total[5m])

      # Token efficiency
      - record: ai_research_agent:tokens_per_query_5m
        expr: |
          rate(ai_research_agent_tokens_used_total[5m]) / 
          rate(ai_research_agent_queries_total[5m])

# Remote write configuration (for long-term storage)
remote_write:
  - url: "https://prometheus-remote-write-endpoint/api/v1/write"
    basic_auth:
      username: "prometheus"
      password_file: "/etc/prometheus/remote_write_password"
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500

# Remote read configuration
remote_read:
  - url: "https://prometheus-remote-read-endpoint/api/v1/read"
    basic_auth:
      username: "prometheus"
      password_file: "/etc/prometheus/remote_read_password"